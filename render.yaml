databases:
  - name: doctorlive-db
    plan: free
    databaseName: doctorlive
    user: doctorlive

services:
  - type: web
    name: doctorlive-api
    plan: free
    runtime: python
    rootDir: doctorlive_backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctorlive-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.7"
